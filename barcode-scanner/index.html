<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>POS Scanner Pro</title>
<script src="https://unpkg.com/@zxing/library@0.21.3"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f4f4}
header{background:#0b6cff;color:#fff;padding:12px;text-align:center}
.wrap{max-width:1100px;margin:auto;padding:15px}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}
video{width:100%;max-height:320px;background:#000}
button{padding:8px 12px;margin:4px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:6px}
</style>
</head>
<body>
<header><h1>POS Scanner Pro</h1></header>
<div class="wrap">
<div class="card">
<video id="video" autoplay muted playsinline></video><br>
<button onclick="startScanner()">Start Scanner</button>
<button onclick="stopScanner()">Stop Scanner</button>
<button onclick="switchCamera()">Switch Camera</button>
<button onclick="printReceipt()">Print Receipt</button>
<button onclick="clearCart()">Clear Items</button>
<div id="status">Ready</div>
</div>

<div class="card">
<table>
<thead><tr><th>Product</th><th>Qty</th><th>Price</th></tr></thead>
<tbody id="cart"></tbody>
</table>
<p>Total Items: <span id="count">0</span></p>
<p>Total: £<span id="grandTotal">0.00</span></p>
</div>
</div>

<script>
const reader=new ZXing.BrowserMultiFormatReader();
const products={
 "123456789012":{name:"Coca-Cola",price:1.20},
 "987654321098":{name:"Chocolate Bar",price:0.85}
};
let cart=[];
let cameras=[];
let currentCamera=0;
let barcodeVisible=false;
let lastBarcode=null;

function render(){
 const tb=document.getElementById('cart');
 tb.innerHTML='';
 let count=0,total=0;
 cart.forEach(i=>{
   count+=i.qty;
   total+=i.qty*i.price;
   tb.innerHTML+=`<tr><td>${i.name}</td><td>${i.qty}</td><td>£${(i.qty*i.price).toFixed(2)}</td></tr>`;
 });
 countEl.textContent=count;
 grandTotal.textContent=total.toFixed(2);
}

function addItem(name,price){
 let e=cart.find(x=>x.name===name);
 if(e)e.qty++;
 else cart.push({name,price,qty:1});
 render();
}

async function startScanner(){
 cameras=await reader.listVideoInputDevices();
 if(!cameras.length){status.textContent='No camera found';return;}
 runCamera();
}

function runCamera(){
 reader.decodeFromVideoDevice(cameras[currentCamera].deviceId,video,(result)=>{
   if(result){
      const code=result.getText();
      if(!barcodeVisible || code!==lastBarcode){
        barcodeVisible=true;
        lastBarcode=code;
        const p=products[code]||{name:'Product '+code,price:1};
        addItem(p.name,p.price);
      }
   } else {
      barcodeVisible=false;
      lastBarcode=null;
   }
 });
 status.textContent='Scanner running - Camera '+(currentCamera+1);
}

function switchCamera(){
 if(cameras.length<2){alert('Only one camera available');return;}
 reader.reset();
 currentCamera=(currentCamera+1)%cameras.length;
 barcodeVisible=false;
 lastBarcode=null;
 runCamera();
}

function stopScanner(){
 try{reader.reset();}catch(e){}
 barcodeVisible=false;
 lastBarcode=null;
 status.textContent='Scanner stopped';
}

function clearCart(){cart=[];render();}

function printReceipt(){
 let total=cart.reduce((s,i)=>s+i.qty*i.price,0);
 let receiptNo='RCP-'+Date.now();
 let rows=cart.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>£${(i.qty*i.price).toFixed(2)}</td></tr>`).join('');
 let w=window.open('','_blank');
 w.document.write(`
 <html><head><title>Receipt</title>
 <style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px}</style>
 </head><body>
 <h2>Store Receipt</h2>
 <p>Receipt: ${receiptNo}</p>
 <p>Date: ${new Date().toLocaleString()}</p>
 <table><tr><th>Item</th><th>Qty</th><th>Total</th></tr>${rows}</table>
 <h3>Grand Total: £${total.toFixed(2)}</h3>
 <p>Thank you for your purchase.</p>
 </body></html>`);
 w.document.close();
 w.print();
}
const countEl=document.getElementById('count');
render();
</script>
</body>
</html>
