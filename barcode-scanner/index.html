<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Inventory Scanner</title>

<script src="https://unpkg.com/@zxing/library@0.21.3"></script>

<style>
:root{
    --bg:#f4f4f4;
    --card:#ffffff;
    --text:#222;
    --muted:#666;
    --primary:#0078ff;
    --success:#0b9b3e;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

body.dark{
    --bg:#111827;
    --card:#1f2937;
    --text:#f3f4f6;
    --muted:#cbd5e1;
    --primary:#3b82f6;
}

.container{
    max-width:1100px;
    margin:20px auto;
    padding:20px;
    background:var(--card);
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.1);
}

h1{
    text-align:center;
}

video{
    width:100%;
    max-height:420px;
    background:#000;
    border-radius:10px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin:15px 0;
}

button{
    border:none;
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
    background:var(--primary);
    color:#fff;
}

.secondary{
    background:#e5e7eb;
    color:#111;
}

.status,.result{
    text-align:center;
    margin:10px 0;
}

.summary{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    margin:20px 0;
}

.summary-card{
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
    min-width:140px;
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

th{
    background:var(--primary);
    color:white;
}

.small{
    color:var(--muted);
    font-size:13px;
}
</style>
</head>
<body>

<div class="container">

<h1>📦 Barcode Inventory Scanner</h1>

<video id="video" autoplay muted playsinline></video>

<div class="controls">
    <button id="startBtn">Start Scanner</button>
    <button id="stopBtn" class="secondary">Stop Scanner</button>
    <button id="switchBtn" class="secondary">Switch Camera</button>
    <button id="clearBtn" class="secondary">Clear Items</button>
    <button id="exportBtn" class="secondary">Export CSV</button>
    <button id="couponBtn" class="secondary">Coupon</button>
    <button id="receiptBtn" class="secondary">Print Receipt</button>
    <button id="soundBtn" class="secondary">Sound On</button>
    <button id="darkBtn" class="secondary">Dark Mode</button>
</div>

<div class="status" id="status">
    Camera not started.
</div>

<div class="result" id="result">
    No barcode detected.
</div>

<div class="summary">
    <div class="summary-card">
        <div class="small">Items</div>
        <div id="totalItems">0</div>
    </div>

    <div class="summary-card">
        <div class="small">Subtotal (£)</div>
        <div id="subtotal">0.00</div>
    </div>

    <div class="summary-card">
        <div class="small">VAT (£)</div>
        <div id="vat">0.00</div>
    </div>

    <div class="summary-card">
        <div class="small">Total (£)</div>
        <div id="total">0.00</div>
    </div>
</div>

<h2>Scanned Items</h2>

<table>
<thead>
<tr>
<th>#</th>
<th>Product</th>
<th>Barcode</th>
<th>Price (£)</th>
</tr>
</thead>
<tbody id="inventoryTable"></tbody>
</table>

</div>

<script>
const codeReader = new ZXing.BrowserMultiFormatReader();

let cameras = [];
let cameraIndex = 0;
let scanning = false;

let items = [];
let subtotal = 0;

let couponType = null;
let couponValue = 0;

let visibleBarcode = null;
let autoTimer = null;

let soundEnabled = true;

const VAT_RATE = 0.20;

const products = {
    "123456789012": {name:"Coca-Cola",price:1.20},
    "987654321098": {name:"Chocolate Bar",price:0.85},
    "111222333444": {name:"Bottle of Water",price:0.99},
    "555666777888": {name:"Bag of Crisps",price:1.10}
};

function beep(){
    if(!soundEnabled) return;

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.frequency.value = 1200;
    osc.start();

    gain.gain.setValueAtTime(.25,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        .001,
        ctx.currentTime + .1
    );

    osc.stop(ctx.currentTime + .1);
}

function saveState(){
    localStorage.setItem(
        "barcodeScanner",
        JSON.stringify({
            items,
            subtotal,
            couponType,
            couponValue,
            darkMode:document.body.classList.contains("dark")
        })
    );
}

function loadState(){
    const raw = localStorage.getItem("barcodeScanner");
    if(!raw) return;

    const state = JSON.parse(raw);

    items = state.items || [];
    subtotal = state.subtotal || 0;
    couponType = state.couponType;
    couponValue = state.couponValue || 0;

    items.forEach((item,index)=>{
        appendRow(index+1,item.name,item.barcode,item.price);
    });

    updateTotals();

    if(state.darkMode){
        document.body.classList.add("dark");
    }
}

function appendRow(index,name,barcode,price){
    const row = document.createElement("tr");

    row.innerHTML = `
        <td>${index}</td>
        <td>${name}</td>
        <td>${barcode}</td>
        <td>£${price.toFixed(2)}</td>
    `;

    inventoryTable.appendChild(row);
}

function updateTotals(){

    let discounted = subtotal;

    if(couponType === "%"){
        discounted -= discounted * (couponValue/100);
    }

    if(couponType === "£"){
        discounted -= couponValue;
    }

    if(discounted < 0){
        discounted = 0;
    }

    const vat = discounted * VAT_RATE;
    const total = discounted + vat;

    totalItems.textContent = items.length;
    subtotalEl.textContent = discounted.toFixed(2);
    vatEl.textContent = vat.toFixed(2);
    totalEl.textContent = total.toFixed(2);
}

async function addItem(barcode){

    let product = products[barcode];

    if(!product){
        product = {
            name:"Product " + barcode,
            price:+(Math.random()*5+0.5).toFixed(2)
        };
    }

    items.push({
        barcode,
        name:product.name,
        price:product.price
    });

    subtotal += product.price;

    appendRow(
        items.length,
        product.name,
        barcode,
        product.price
    );

    updateTotals();
    saveState();
    beep();
}

function startAutoScan(){

    if(autoTimer) return;

    addItem(visibleBarcode);

    autoTimer = setInterval(()=>{
        if(visibleBarcode){
            addItem(visibleBarcode);
        }
    },3000);
}

function stopAutoScan(){
    clearInterval(autoTimer);
    autoTimer = null;
}

async function startScanner(){

    cameras = await codeReader.listVideoInputDevices();

    if(!cameras.length){
        alert("No camera found");
        return;
    }

    scanning = true;

    codeReader.decodeFromVideoDevice(
        cameras[cameraIndex].deviceId,
        video,
        (result)=>{
            if(result){

                const code = result.getText();

                resultDiv.textContent =
                    "Detected: " + code;

                if(code !== visibleBarcode){
                    visibleBarcode = code;
                    startAutoScan();
                }
            }
        }
    );

    status.textContent = "Scanner running";
}

function stopScanner(){

    codeReader.reset();

    scanning = false;
    visibleBarcode = null;

    stopAutoScan();

    status.textContent = "Scanner stopped";
}

function switchCamera(){

    if(cameras.length < 2){
        alert("Only one camera available");
        return;
    }

    cameraIndex =
        (cameraIndex + 1) % cameras.length;

    stopScanner();
    startScanner();
}

function clearItems(){

    if(!confirm("Clear all items?")) return;

    items = [];
    subtotal = 0;

    inventoryTable.innerHTML = "";

    updateTotals();
    saveState();
}

function exportCSV(){

    let csv = "No,Product,Barcode,Price\n";

    items.forEach((item,index)=>{
        csv +=
            `${index+1},"${item.name}",${item.barcode},${item.price}\n`;
    });

    const blob = new Blob(
        [csv],
        {type:"text/csv"}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "inventory.csv";
    a.click();

    URL.revokeObjectURL(url);
}

function printReceipt(){

    const w = window.open("");

    let html = `
    <html>
    <body>
    <h2>Receipt</h2>
    <hr>
    `;

    items.forEach((item,index)=>{
        html += `
        <p>
        ${index+1}.
        ${item.name}
        - £${item.price.toFixed(2)}
        </p>
        `;
    });

    html += `
    <hr>
    <p>Items: ${items.length}</p>
    <p>Subtotal: £${subtotal.toFixed(2)}</p>
    </body>
    </html>
    `;

    w.document.write(html);
    w.print();
}

function applyCoupon(){

    const value =
        prompt("Enter coupon (10% or 2.50)");

    if(!value){
        couponType = null;
        couponValue = 0;
    }
    else if(value.includes("%")){
        couponType = "%";
        couponValue = parseFloat(value);
    }
    else{
        couponType = "£";
        couponValue = parseFloat(value);
    }

    updateTotals();
    saveState();
}

const video = document.getElementById("video");
const inventoryTable =
    document.getElementById("inventoryTable");

const status =
    document.getElementById("status");

const resultDiv =
    document.getElementById("result");

const totalItems =
    document.getElementById("totalItems");

const subtotalEl =
    document.getElementById("subtotal");

const vatEl =
    document.getElementById("vat");

const totalEl =
    document.getElementById("total");

startBtn.onclick = startScanner;
stopBtn.onclick = stopScanner;
switchBtn.onclick = switchCamera;
clearBtn.onclick = clearItems;
exportBtn.onclick = exportCSV;
receiptBtn.onclick = printReceipt;
couponBtn.onclick = applyCoupon;

soundBtn.onclick = ()=>{
    soundEnabled = !soundEnabled;
    soundBtn.textContent =
        soundEnabled ? "Sound On" : "Sound Off";
};

darkBtn.onclick = ()=>{
    document.body.classList.toggle("dark");
    saveState();
};

loadState();
</script>

</body>
</html>
