  let cart = [];
let barcodeVisible = false;
let lastBarcode = null;

const countEl = document.getElementById('count');
const grandTotalEl = document.getElementById('grandTotal');
const beepSound = document.getElementById('beep');

function render(){
 const tb = document.getElementById('cart');
 tb.innerHTML = '';

 let count = 0;
 let total = 0;

 cart.forEach(item => {
   count += item.qty;
   total += item.qty * item.price;

   tb.innerHTML += `
     <tr>
       <td>${item.name}</td>
       <td>${item.qty}</td>
       <td>£${(item.qty * item.price).toFixed(2)}</td>
     </tr>`;
 });

 countEl.textContent = count;
 grandTotalEl.textContent = total.toFixed(2);
}

function addItem(name, price){
 let existing = cart.find(i => i.name === name);
 if(existing){
   existing.qty++;
 } else {
   cart.push({name, price, qty:1});
 }
 render();
}

async function startScanner(){
 cameras = await reader.listVideoInputDevices();
 if(!cameras.length){
   status.textContent = "No camera found";
   return;
 }
 runCamera();
}

function runCamera(){
 reader.decodeFromVideoDevice(cameras[currentCamera].deviceId, video, (result, err) => {
   if(result){
     const code = result.getText();

     // Prevent duplicate scans until barcode leaves view
     if(!barcodeVisible || code !== lastBarcode){
       barcodeVisible = true;
       lastBarcode = code;

       const product = products[code] || {name:"Product " + code, price:1.00};
       addItem(product.name, product.price);

       beepSound.currentTime = 0;
       beepSound.play();
     }
   } else {
     // Barcode left view
     barcodeVisible = false;
     lastBarcode = null;
   }
 });

 status.textContent = "Scanner running - Camera " + (currentCamera + 1);
}

function switchCamera(){
 if(cameras.length < 2){
   alert("Only one camera available");
   return;
 }
 reader.reset();
 barcodeVisible = false;
 lastBarcode = null;

 currentCamera = (currentCamera + 1) % cameras.length;
 runCamera();
}

function stopScanner(){
 try { reader.reset(); } catch(e){}
 barcodeVisible = false;
 lastBarcode = null;
 status.textContent = "Scanner stopped";
}

function clearCart(){
 cart = [];
 render();
}

function printReceipt(){
 let total = cart.reduce((sum, i) => sum + i.qty * i.price, 0);
 let receiptNo = "RCP-" + Date.now();

 let rows = cart.map(i =>
   `<tr><td>${i.name}</td><td>${i.qty}</td><td>£${(i.qty*i.price).toFixed(2)}</td></tr>`
 ).join('');

 let w = window.open("", "_blank");
 w.document.write(`
 <html><head><title>Receipt</title>
 <style>
 body{font-family:Arial;padding:20px}
 table{width:100%;border-collapse:collapse}
 td,th{border:1px solid #ccc;padding:6px}
 </style>
 </head><body>
 <h2>Store Receipt</h2>
 <p>Receipt: ${receiptNo}</p>
 <p>Date: ${new Date().toLocaleString()}</p>
 <table>
   <tr><th>Item</th><th>Qty</th><th>Total</th></tr>
   ${rows}
 </table>
 <h3>Grand Total: £${total.toFixed(2)}</h3>
 <p>Thank You</p>
 </body></html>
 `);
 w.document.close();
 w.print();
}
